<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ainovel WebUI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">

    <!-- ============ 书架视图 ============ -->
    <section id="view-shelf" class="view">
      <header class="topbar">
        <div class="brand">ainovel <span class="brand-sub">AI 小说创作工作台</span>
          <span class="version" id="shelf-version"></span>
        </div>
        <div class="topbar-actions">
          <span class="user-badge" id="shelf-user" title="当前用户"></span>
          <button id="btn-shelf-config" class="btn" type="button">配置</button>
          <button id="btn-new-book" class="btn primary" type="button">＋ 新建书</button>
          <button id="btn-logout" class="btn" type="button" title="退出登录">退出</button>
        </div>
      </header>
      <div id="book-list" class="book-list"></div>
      <p id="shelf-empty" class="muted center hidden">书架空空如也——点击「新建书」开始你的创作。</p>
    </section>

    <!-- ============ 工作台视图 ============ -->
    <section id="view-workspace" class="view hidden">
      <header class="topbar">
        <button id="btn-back" class="btn" type="button" title="返回书架">← 书架</button>
        <div class="book-title" id="ws-title"></div>
        <div class="status-pill" id="ws-status"></div>
        <div class="topbar-actions">
          <span class="user-badge" id="ws-user" title="当前用户"></span>
          <button id="btn-delete-book" class="btn danger" type="button" title="删除当前小说">删除</button>
          <button id="btn-models" class="btn" type="button">模型</button>
          <button id="btn-ws-config" class="btn" type="button">配置</button>
          <button id="btn-diag" class="btn" type="button">诊断</button>
          <button id="btn-help" class="btn" type="button">帮助</button>
        </div>
      </header>

      <div class="workspace">
        <!-- 左栏：状态 -->
        <aside id="panel-state" class="panel state-panel">
          <div class="panel-title">状态</div>
          <div id="state-content" class="panel-body"></div>
        </aside>

        <!-- 中栏：事件流（上，可折叠）+ 输出（下，主区） -->
        <main class="center">
          <div id="center-events" class="center-events">
            <button id="btn-toggle-events" class="center-title" type="button" title="折叠/展开事件流">
              <span id="events-fold-icon">▾</span> 事件流
            </button>
            <div id="events" class="scroll-area"></div>
          </div>
          <div class="center-stream">
            <div class="center-title">输出</div>
            <div id="stream" class="scroll-area"></div>
          </div>
        </main>

        <!-- 右栏：详情 -->
        <aside id="panel-detail" class="panel detail-panel">
          <div class="panel-title">详情</div>
          <div id="detail-content" class="panel-body"></div>
        </aside>
      </div>

      <footer class="input-bar">
        <textarea id="input" rows="2" placeholder="输入创作指令（/ 查看命令）…"></textarea>
        <div class="input-row">
          <div class="input-actions">
            <button id="btn-pause" class="btn" type="button" title="暂停引擎">⏸ 暂停</button>
            <button id="btn-resume" class="btn" type="button" title="恢复创作">▶ 恢复</button>
            <button id="btn-send" class="btn primary" type="button">发送</button>
          </div>
          <span class="input-hint muted">Enter 发送 · Shift+Enter 换行 · / 打开命令面板</span>
        </div>
      </footer>
    </section>

    <!-- ============ 首次引导视图 ============ -->
    <section id="view-setup" class="view hidden">
      <div class="setup-wrap">
        <h1>ainovel WebUI 初始化</h1>
        <p class="muted">尚未检测到配置文件，先配置一个模型 Provider。</p>
        <form id="setup-form">
          <label>1. Provider
            <select id="setup-provider" required></select>
          </label>
          <label>Provider 名称（自定义代理时）
            <input id="setup-provider-name" placeholder="my-proxy">
          </label>
          <label>2. API Key（可留空）
            <input id="setup-apikey" placeholder="sk-xxx" autocomplete="off">
          </label>
          <label>3. Base URL（留空使用官方地址）
            <input id="setup-baseurl" placeholder="https://openrouter.ai/api/v1">
          </label>
          <label>4. 模型名称
            <input id="setup-model" placeholder="gpt-4o / claude-sonnet-4 / gemini-2.5-pro" required>
          </label>
          <button class="btn primary" type="submit">保存配置</button>
          <p id="setup-error" class="error hidden"></p>
        </form>
      </div>
    </section>

    <!-- ============ 鉴权视图（登录 / 首次设置密码） ============ -->
    <section id="view-auth" class="view hidden">
      <div class="setup-wrap">
        <h1>ainovel WebUI</h1>
        <div id="auth-setup-form" class="hidden">
          <p class="muted">首次使用，请设置访问密码以保护你的创作数据。</p>
          <form id="setup-auth-form">
            <label>显示名
              <input id="auth-name" placeholder="你的昵称">
            </label>
            <label>访问密码
              <input id="auth-pw" type="password" placeholder="至少 6 位" autocomplete="new-password">
            </label>
            <button class="btn primary" type="submit">设置并进入</button>
          </form>
        </div>
        <div id="auth-login-form">
          <p class="muted">请输入访问密码。</p>
          <form id="login-form">
            <label>访问密码
              <input id="login-pw" type="password" autocomplete="current-password">
            </label>
            <button class="btn primary" type="submit">登录</button>
          </form>
        </div>
        <p id="auth-error" class="error hidden"></p>
      </div>
    </section>

    <!-- 模态框与提示容器 -->
    <div id="modal-root"></div>
    <div id="toast-root"></div>
  </div>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
