services:
  ainovel:
    image: ghcr.io/bigxixi/ainovel-webui:latest
    build:
      context: .
    ports:
      - "5269:5269"
    volumes:
      # 配置目录（含首次引导生成的 config.json 与全局写作偏好）
      - ./config:/root/.ainovel
      # 书架目录：每本书一个子目录（AINOVEL_BOOKS_DIR=/workspace/books）
      - ./workspace:/workspace
    environment:
      - AINOVEL_WEB_PORT=5269
      # 容器内必须监听所有接口，端口映射才能生效（本机直跑默认 127.0.0.1 更安全）
      - AINOVEL_WEB_HOST=0.0.0.0
      - AINOVEL_BOOKS_DIR=/workspace/books
    restart: unless-stopped
